name: ipfs_node_example
description: macOS public IPFS connectivity example for ipfs-node-flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ipfs_node_flutter:
    path: ../packages/ipfs_node_flutter
  # Explicit platform implementations. The federated plugin registrant normally
  # installs these automatically; the example also registers them explicitly in
  # main.dart as an idempotent safety net.
  ipfs_node_flutter_native:
    path: ../packages/ipfs_node_flutter_native
  ipfs_node_flutter_web:
    path: ../packages/ipfs_node_flutter_web
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
